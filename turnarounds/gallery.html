<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Read My Bible Quest · Character Wardrobe</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#f3f5fa;color:#17337a;font-family:system-ui,-apple-system,sans-serif}button{font:inherit;cursor:pointer}header{padding:26px clamp(18px,5vw,64px);background:#0035e3;color:#fff}header>div{display:flex;align-items:center;gap:20px}.mark{width:66px;height:66px;padding:5px;background:white;border-radius:12px;object-fit:contain}.back{color:#fff;font-weight:800;text-decoration:none}.back:hover{text-decoration:underline}h1{margin:4px 0;font-size:clamp(29px,4vw,46px)}header p{margin:5px 0 0;color:#e8efff}main{padding:24px clamp(18px,5vw,64px) 70px;max-width:1500px;margin:auto}.toolbar{display:flex;flex-wrap:wrap;gap:13px;align-items:center;background:#fff;border:1px solid #d9e2f5;border-radius:17px;padding:13px 15px}.group{display:flex;align-items:center;gap:7px;flex-wrap:wrap}.group b{font-size:12px;margin-right:5px}.pill{border:2px solid #dbe4f5;background:#fff;color:#17337a;border-radius:999px;padding:7px 12px;font-size:12px;font-weight:800}.pill.active{border-color:#0035e3;background:#0035e3;color:#fff}.swatch{width:31px;height:31px;border:3px solid #fff;outline:1px solid #b9c9e5;border-radius:50%;background:var(--swatch)}.swatch.active{outline:3px solid #0035e3}section{margin-top:30px}h2{font-size:25px;margin:0 0 12px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}.card{border:2px solid #dbe4f5;background:#fff;color:#17337a;border-radius:15px;padding:9px;display:flex;flex-direction:column;align-items:center;text-align:center;min-width:0;box-shadow:0 5px 0 #0035e30d}.card:hover,.card:focus-visible{border-color:#f95600;transform:translateY(-2px)}.thumb{width:100px;height:175px;background-size:400% 200%;background-position:0 0;background-repeat:no-repeat}.card b{font-size:13px;line-height:1.2}.card small{color:#687ca5;font-size:10px;margin-top:3px}.overlay{position:fixed;inset:0;background:#071847db;display:grid;place-items:center;padding:12px;z-index:5}.overlay[hidden]{display:none}.viewer{width:min(94vw,520px);background:white;border:5px solid #fbc92c;border-radius:21px;padding:16px;text-align:center;box-shadow:0 25px 80px #0007}.viewer-top{display:flex;justify-content:space-between;align-items:center;gap:8px}.viewer h2{font-size:clamp(22px,4vw,31px);margin:0}.close{border:0;background:#e9efff;border-radius:50%;width:36px;height:36px;font-size:22px}.stage{height:min(62vh,560px);min-height:300px;display:grid;place-items:center;border-radius:14px;background:radial-gradient(#fff,#e9efff);margin:12px 0;touch-action:none;cursor:grab}.frame{height:min(58vh,535px);aspect-ratio:336/585;background-size:400% 200%;background-position:0 0;background-repeat:no-repeat;pointer-events:none}.controls{display:flex;align-items:center;justify-content:center;gap:20px}.controls button{border:0;border-radius:50%;background:#fbc92c;color:#17337a;width:42px;height:42px;font-size:25px}.controls span{min-width:105px;font-weight:800}.hint{font-size:12px;color:#6479a1;margin:10px 0 0}
  </style>
</head>
<body>
  <header><a class="back" href="../index.html">← Back to the game</a><div><img class="mark" src="../favor-kids-logo.webp" alt="Favor Kids"><div><h1>Character Wardrobe</h1><p>28 unlocks · 5 hairstyles for this explorer · 8 angles each</p></div></div></header>
  <main><div class="toolbar"><div class="group"><b id="genderLabel">Explorer</b></div><div class="group" id="hairColorOptions"><b>Hair</b></div><div class="group" id="skinOptions"><b>Skin</b></div><div class="group" id="eyeOptions"><b>Eyes</b></div></div><div id="gallery"></div></main>
  <div id="overlay" class="overlay" hidden><div class="viewer" role="dialog" aria-modal="true" aria-labelledby="viewerTitle"><div class="viewer-top"><h2 id="viewerTitle"></h2><button id="close" class="close" aria-label="Close">×</button></div><div id="stage" class="stage"><div id="frame" class="frame" role="img"></div></div><div class="controls"><button id="left" aria-label="Turn left">↶</button><span id="angle">Front</span><button id="right" aria-label="Turn right">↷</button></div><p class="hint">Drag the character or use the arrows to see every angle.</p></div></div>
  <script src="../cosmetics.js"></script>
  <script>window.CHARACTER_ROOT='../';const SKINS=['#d9a983','#ca9670','#bb835d','#ad7352','#9e6446'];</script>
  <script src="../character-art.js"></script>
  <script>
    const labels=['Front','Front right','Right side','Back right','Back','Back left','Left side','Front left'];
    const gallery=document.getElementById('gallery'),overlay=document.getElementById('overlay'),frame=document.getElementById('frame'),angleLabel=document.getElementById('angle');
    let saved={};try{saved=JSON.parse(localStorage.getItem('matthew-quest-v1')||'{}');}catch{}const selected=saved.profiles?.find(p=>p.id===saved.currentId),gender=['girl','female','woman'].includes(selected?.gender)?'girl':'boy';
    let skin=selected?.skin??2,eyes=selected?.eyes??0,hairColor=selected?.hairColor??0,active=null,angle=0,startX=null,request=0;
    function renderControls(){document.getElementById('genderLabel').textContent=gender==='girl'?'Girl explorer':'Boy explorer';document.getElementById('hairColorOptions').innerHTML='<b>Hair</b>'+HAIR_COLORS.map((v,i)=>`<button class="swatch ${i===hairColor?'active':''}" data-hair-color="${i}" style="--swatch:${v.color}" aria-label="${v.name} hair"></button>`).join('');document.getElementById('skinOptions').innerHTML='<b>Skin</b>'+SKINS.map((v,i)=>`<button class="swatch ${i===skin?'active':''}" data-skin="${i}" style="--swatch:${v}" aria-label="Skin tone ${i+1}"></button>`).join('');document.getElementById('eyeOptions').innerHTML='<b>Eyes</b>'+EYE_COLORS.map((v,i)=>`<button class="swatch ${i===eyes?'active':''}" data-eyes="${i}" style="--swatch:${v.color}" aria-label="${v.name} eyes"></button>`).join('');document.querySelectorAll('[data-hair-color]').forEach(b=>b.onclick=()=>{hairColor=Number(b.dataset.hairColor);refresh();});document.querySelectorAll('[data-skin]').forEach(b=>b.onclick=()=>{skin=Number(b.dataset.skin);refresh();});document.querySelectorAll('[data-eyes]').forEach(b=>b.onclick=()=>{eyes=Number(b.dataset.eyes);refresh();});document.getElementById('hairColorOptions').hidden=active?.kind==='hair'&&active.item.bald;}
    function makeCard(item,kind){const card=document.createElement('button'),thumb=document.createElement('div'),name=document.createElement('b'),small=document.createElement('small');card.className='card';thumb.className='thumb';name.textContent=item.name;small.textContent=kind==='hair'?'Hairstyle':`Matthew ${item.chapter}`;card.append(thumb,name,small);card.onclick=()=>open(item,kind);const src=kind==='hair'?variantPath(gender,null,item.index):gender==='girl'&&item.type==='outfit'?'../turnarounds/'+item.id+'.webp':variantPath(gender,item,0);thumb.style.backgroundImage=`url('${src}')`;if(kind==='hair'&&hairColor&&!item.bald)characterSheet(gender,null,item.index,2,0,hairColor).then(img=>{if(card.isConnected)thumb.style.backgroundImage=`url('${img}')`;});return card;}
    function renderGallery(){gallery.replaceChildren();{const section=document.createElement('section'),h=document.createElement('h2'),grid=document.createElement('div');h.textContent='Hairstyles · 5';grid.className='grid';hairstylesFor(gender).forEach((hair,i)=>grid.append(makeCard({...hair,index:i},'hair')));section.append(h,grid);gallery.append(section);}for(const type of COSMETIC_TYPES){const section=document.createElement('section'),h=document.createElement('h2'),grid=document.createElement('div');h.textContent=`${COSMETIC_LABELS[type]} · ${COSMETICS.filter(x=>x.type===type).length}`;grid.className='grid';COSMETICS.filter(x=>x.type===type).forEach(item=>grid.append(makeCard(item,'item')));section.append(h,grid);gallery.append(section);}}
    function refresh(){renderControls();renderGallery();if(active)showActive();}
    function setAngle(n){angle=(n+8)%8;frame.style.backgroundPosition=`${angle%4*100/3}% ${angle<4?0:100}%`;frame.setAttribute('aria-label',`${active.item.name}, ${labels[angle]} view`);angleLabel.textContent=labels[angle];}
    function showActive(){const ticket=++request,item=active.item,kind=active.kind;document.getElementById('viewerTitle').textContent=item.name;frame.style.backgroundImage='none';characterSheet(gender,kind==='hair'?null:item,kind==='hair'?item.index:0,skin,eyes,hairColor).then(src=>{if(ticket===request)frame.style.backgroundImage=`url('${src}')`;}).catch(()=>{});setAngle(angle);}
    function open(item,kind){active={item,kind};angle=0;overlay.hidden=false;renderControls();showActive();document.getElementById('close').focus();}
    function closeViewer(){overlay.hidden=true;active=null;request++;}
    document.getElementById('left').onclick=()=>setAngle(angle-1);document.getElementById('right').onclick=()=>setAngle(angle+1);document.getElementById('close').onclick=closeViewer;overlay.addEventListener('click',e=>{if(e.target===overlay)closeViewer();});document.addEventListener('keydown',e=>{if(overlay.hidden)return;if(e.key==='Escape')closeViewer();if(e.key==='ArrowLeft')setAngle(angle-1);if(e.key==='ArrowRight')setAngle(angle+1);});const stage=document.getElementById('stage');stage.addEventListener('pointerdown',e=>{startX=e.clientX;stage.setPointerCapture(e.pointerId);});stage.addEventListener('pointermove',e=>{if(startX==null)return;const steps=Math.trunc((e.clientX-startX)/22);if(steps){setAngle(angle+steps);startX+=steps*22;}});stage.addEventListener('pointerup',()=>startX=null);stage.addEventListener('pointercancel',()=>startX=null);refresh();
  </script>
</body>
</html>
